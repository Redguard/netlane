[project]
name = "netlane"
version = "0.1.0"
description = "Intercept mobile app traffic via WireGuard and forward it to tools such as Burp Suite"
readme = "README.md"
authors = [
    { name = "Benjamin Faller", email = "benjamin.faller@redguard.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "qrcode>=8.2",
]

[project.scripts]
netlane = "netlane.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
