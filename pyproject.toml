[project]
name = "netlane"
version = "0.1.0"
description = "Intercept mobile app traffic via WireGuard and forward it to tools such as Burp Suite"
readme = "README.md"
authors = [
    { name = "Benjamin Faller", email = "benjamin.faller@redguard.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "qrcode>=8.2",
]

[project.scripts]
netlane = "netlane.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "C4", "PIE", "PT", "RET", "RUF", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
# Unit and integration tests share module basenames (e.g. test_adb_reverse.py).
addopts = ["--import-mode=importlib"]
markers = [
    "integration: marks tests as integration tests that require containers/services (deselect with '-m \"not integration\"')",
]
