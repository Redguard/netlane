services:
  vps:
    build:
      context: .
      dockerfile: tests/integration/docker/vps/Dockerfile
    container_name: netlane-vps
    privileged: true
    cgroup: private
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "2222:22"
      - "51820:51820/udp"
    networks:
      - netlane-test

  redroid:
    # Newest redroid with flattened APEX modules. From 15.0.0 on, apexd attaches
    # every module to a loop device, which lives in the shared host kernel.
    # 64-bit only: on GitHub's runners the 32-bit zygote of the multilib image dies
    # at start, and init then restarts the 64-bit one in a loop (boot never completes).
    image: redroid/redroid:14.0.0_64only-latest
    container_name: netlane-redroid
    # Not privileged: the only host devices the container may touch are binder
    # nodes, so it cannot create loop devices or reach host disks.
    cap_add:
      - ALL
    cap_drop:
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_BOOT
      - SYS_TIME
      - MAC_ADMIN
      - MAC_OVERRIDE
    security_opt:
      # Android init mounts its own filesystems (binderfs, tmpfs, ...).
      - apparmor=unconfined
    device_cgroup_rules:
      # binderfs gets a dynamic major: awk '$$2=="binder"{print $$1}' /proc/devices
      - "c ${BINDER_MAJOR:?set BINDER_MAJOR to the binder major from /proc/devices}:* rwm"
    tmpfs:
      # Docker's read-only /sys makes init abort; it mounts its own sysfs here.
      - /sys
    ports:
      - "5555:5555"
    networks:
      - netlane-test

  remote:
    # A host on the "internet" beyond the gateway or device, recording what reaches it.
    build:
      context: tests/integration/docker/remote
    container_name: netlane-remote
    init: true
    networks:
      - netlane-test

networks:
  netlane-test:
    name: netlane-test
