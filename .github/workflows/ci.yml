name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:

# Not keyed on github.workflow: when called from package.yml that is the caller's
# name, and sharing its concurrency group would cancel the caller.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Black & Pyright)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code formatting (Black)
        run: uv run black --check .

      - name: Run type checking (Pyright)
        run: uv run pyright

  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    env:
      COMPOSE_FILE: tests/integration/compose.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load kernel modules for the containers
        run: |
          # The containers share the runner's kernel and cannot load modules themselves.
          # redroid needs binder and the legacy iptables tables, the VPS WireGuard and nftables.
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe -a iptable_filter iptable_nat ip6table_filter ip6table_nat \
            xt_owner xt_comment ipt_REJECT ip6t_REJECT
          sudo modprobe -a wireguard nf_tables nft_ct nft_chain_nat nft_nat nft_masq \
            nft_reject_inet
          # The redroid container is only granted the binder devices (dynamic major).
          echo "BINDER_MAJOR=$(awk '$2=="binder"{print $1}' /proc/devices)" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: docker compose run --rm --build runner

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Remove test containers
        if: always()
        run: docker compose down -v
