name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-test:
    name: VPS Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start VPS container
        run: |
          docker compose -f docker-compose.test.yml up -d --build vps
          python3 -c "
          import socket, time, sys
          port = 2222
          for i in range(30):
              for host in ['127.0.0.1', 'localhost']:
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          print(f'VPS SSH ready on {host}:{port}')
                          sys.exit(0)
                  except OSError:
                      pass
              time.sleep(1)
          sys.exit('Timed out waiting for VPS SSH on port 2222')
          "

      - name: Run integration tests
        run: uv run pytest tests/integration

      - name: Teardown test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

