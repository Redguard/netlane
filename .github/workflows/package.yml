name: Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSION: "3.15"

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Release artifacts are built from fresh downloads, never from a shared cache.
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke-env --python "$PYTHON_VERSION"
          uv pip install --python /tmp/smoke-env dist/*.whl
          /tmp/smoke-env/bin/netlane --help
          /tmp/smoke-env/bin/python -c "import netlane; print(netlane.__file__)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish (stub)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # TODO: publish the built distributions (e.g. PyPI Trusted Publishing).
      - name: Publishing is not implemented yet
        env:
          TAG: ${{ github.ref_name }}
        run: echo "Would publish $TAG, but publishing is not implemented yet."
