name: Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & Smoke Test Package
    needs: ci
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package (sdist and wheel)
        run: uv build

      - name: Smoke test built wheel in isolated environment
        run: |
          # Create clean isolated virtual environment
          uv venv /tmp/smoke-env --python 3.12
          # Install built wheel into isolated environment
          uv pip install --python /tmp/smoke-env dist/*.whl
          # Verify CLI entry point and package import work
          /tmp/smoke-env/bin/netlane --help
          /tmp/smoke-env/bin/python -c "import netlane; print(f'Successfully imported netlane from {netlane.__file__}')"

      - name: Upload distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish (stub)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      # TODO: publish the built distributions (e.g. PyPI Trusted Publishing).
      - name: Publishing is not implemented yet
        run: echo "Would publish ${{ github.ref_name }}, but publishing is not implemented yet."
