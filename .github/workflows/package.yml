name: Package & Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI? (false = dry run build & test only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start VPS integration test container
        run: |
          docker compose -f docker-compose.test.yml up -d --build vps
          python3 -c "
          import socket, time, sys
          port = 2222
          for i in range(30):
              for host in ['127.0.0.1', 'localhost']:
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          print(f'VPS SSH ready on {host}:{port}')
                          sys.exit(0)
                  except OSError:
                      pass
              time.sleep(1)
          sys.exit('Timed out waiting for VPS SSH on port 2222')
          "

      - name: Run integration tests
        run: uv run pytest tests/integration

      - name: Teardown test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Build & Smoke Test Package
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build package (sdist and wheel)
        run: uv build

      - name: Smoke test built wheel in isolated environment
        run: |
          # Create clean isolated virtual environment
          uv venv /tmp/smoke-env --python 3.12
          # Install built wheel into isolated environment
          uv pip install --python /tmp/smoke-env dist/*.whl
          # Verify CLI entry point and package import work
          /tmp/smoke-env/bin/netlane --help
          /tmp/smoke-env/bin/python -c "import netlane; print(f'Successfully imported netlane from {netlane.__file__}')"

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment:
      name: pypi
      url: https://pypi.org/p/netlane
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

