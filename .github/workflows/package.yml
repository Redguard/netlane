name: Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSION: "3.15"

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Release artifacts are built from fresh downloads, never from a shared cache.
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke-env --python "$PYTHON_VERSION"
          uv pip install --python /tmp/smoke-env dist/*.whl
          /tmp/smoke-env/bin/netlane --help
          /tmp/smoke-env/bin/python -c "import netlane; print(netlane.__file__)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    # Only version tags are published, manual runs stop after the build.
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The environment name is part of the trusted publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/netlane/
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
