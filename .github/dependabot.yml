version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /tests/integration/docker/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      images:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /tests/integration
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Newer redroid images need loop devices and do not boot in the test environment.
      - dependency-name: redroid/redroid

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
